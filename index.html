<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Linh Phan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Lấy cả 2 font: Caveat (cho tiêu đề) và Dancing Script (chỉ dùng cho popup trang 4) -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Dancing+Script:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ PAGE 1 ============ -->
<section id="page1" class="page active">
  <div class="p1-wrap">
    <svg class="star s1" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s2" viewBox="0 0 24 24" fill="#6fb3d8"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s3" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s4" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s5" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s6" viewBox="0 0 24 24" fill="#6fb3d8"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s7" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s8" viewBox="0 0 24 24" fill="#f2789f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>

    <h1 class="p1-title" id="p1Title">chào linh phan</h1>

    <button class="envelope-btn" id="envelopeBtn" aria-label="Mở thư">
      <div class="envelope">
        <div class="env-body"></div>
        <div class="env-seal">
          <img src="ICON/CAT 1.png" alt="Cat holding flowers">
        </div>
        <div class="env-flap"></div>
      </div>
    </button>

    <p class="p1-hint" id="p1Hint">CLICK THE ENVELOPE!</p>
  </div>
</section>

<!-- ============ PAGE 2 ============ -->
<section id="page2" class="page">
  <div class="nav-group">
    <button class="nav-btn" data-go="page1" aria-label="Quay lại">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" data-go="page3" aria-label="Trang tiếp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>
  <div class="p2-inner">
    <svg class="star s1" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s2" viewBox="0 0 24 24" fill="#6fb3d8"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s3" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s4" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s5" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s6" viewBox="0 0 24 24" fill="#6fb3d8"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>

    <h2 class="p2-title" id="p2Title">A song remind me of you</h2>

    <div class="p2-main-content">
      <div class="vinyl-wrap">
        <div class="vinyl paused" id="vinyl">
          <div class="vinyl-center">
            <img id="vinylCover" src="" alt="Vinyl Cover">
          </div>
        </div>
      </div>

      <div class="p2-playlist">
        <img class="song-btn active" src="ICON/btn1.png" data-index="0" alt="Song 1">
        <img class="song-btn" src="ICON/btn2.png" data-index="1" alt="Song 2">
        <img class="song-btn" src="ICON/btn3.png" data-index="2" alt="Song 3">
      </div>
    </div>

    <div class="p2-bottom-controls">
      <p class="p2-tags" id="p2Tags">Take Care - Youz</p>
      <div class="p2-progress">
        <button class="p2-play" id="p2Play">▶</button>
        <div class="p2-bar"><div class="p2-bar-fill" id="p2BarFill"></div></div>
        <span id="p2Time">0:00 / 0:00</span>
      </div>
    </div>

    <audio id="bgAudio" src="" preload="metadata"></audio>
  </div>
</section>

<!-- ============ PAGE 3 ============ -->
<section id="page3" class="page">
  <div class="nav-group">
    <button class="nav-btn" data-go="page2" aria-label="Quay lại">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <button class="nav-btn" data-go="page4" aria-label="Trang tiếp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
  </div>
  
  <div class="p3-inner">
    <svg class="star s1" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s2" viewBox="0 0 24 24" fill="#6fb3d8"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s3" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s4" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s5" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>

    <!-- Trái: Ảnh ghép -->
    <div class="p3-left">
      <img src="ICON/Happy Birthday Collage.png" alt="Happy Birthday Collage">
    </div>
    <!-- Phải: Lời chúc -->
    <div class="p3-right">
      <img src="ICON/Group 8.png" alt="Birthday Letter">
    </div>
  </div>
</section>

<!-- ============ PAGE 4 ============ -->
<section id="page4" class="page">
  <button class="nav-btn solo" data-go="page3" aria-label="Quay lại">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <div class="p4-inner">
    <svg class="star s1" viewBox="0 0 24 24" fill="#e9e6de"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s2" viewBox="0 0 24 24" fill="#6fb3d8"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s3" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>
    <svg class="star s4" viewBox="0 0 24 24" fill="#e07a4f"><path d="M12 0l2.9 8.9H24l-7.5 5.5 2.9 8.9L12 17.8 4.6 23.3l2.9-8.9L0 8.9h9.1z"/></svg>

    <div class="heart-wrap" id="heartWrap">
      <div class="heart"></div>
    </div>
    <h2 class="p4-title" id="p4Title">for you</h2>
    <p class="p4-msg" id="p4Msg">Cảm ơn vì đã luôn ở đó.</p>
    <button class="p4-restart" data-go="page1">xem lại từ đầu</button>
  </div>

  <!-- confession popup -->
  <div class="p4-modal-overlay" id="p4Modal">
    <div class="p4-modal-card">
      <p class="p4-modal-q" id="p4Question">huy nguyễn có dzai không?</p>
      <div class="p4-modal-actions">
        <button class="p4-modal-btn" data-answer="yes" id="p4AnswerYes">Yes</button>
        <button class="p4-modal-btn" data-answer="absolutely" id="p4AnswerAbs">Absolutely</button>
      </div>
    </div>
  </div>
</section>

<script src="script.js" defer></script>
</body>
</html>
